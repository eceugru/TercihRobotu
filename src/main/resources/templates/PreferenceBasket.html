<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tercih Sepeti</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        .sortable-row {
            cursor: move;
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h3 class="mb-4">🎓 Tercih Sepetiniz</h3>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>Tercih Sırası</th>
            <th>YÖP Kodu</th>
            <th>Üniversite</th>
            <th>Program Adı</th>
            <th>Üniversite Türü</th>
            <th>Kontenjan</th>
            <th>Taban Başarı Sıralaması</th>
            <th>Taban Puan</th>
            <th>Web Sitesi</th>
            <th>İşlem</th>
        </tr>
        </thead>
        <tbody id="sortable-table">
        <tr th:each="program, iterStat : ${tercihListesi}" class="sortable-row">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${program.department.yop_code}"></td>
            <td>
                <span th:text="${program.department.university_name}"></span><br>
                <small th:text="${program.department.faculty_name}"></small>
            </td>
            <td>
                <span th:text="${program.department.program_name}"></span><br>
                <small><span th:text="${program.department.program_language}"></span> (<span th:text="${program.department.program_duraction} + ' yıl'"></span>)</small>
            </td>

            <td th:text="${program.department.university_type}"></td>
            <td th:text="${program.department.program_quota}"></td>
            <td th:text="${program.department.program_success_rank}"></td>
            <td th:text="${program.department.program_base_score}"></td>
            <td><a th:href="${program.department.program_website}" target="_blank" th:text="${program.department.program_website}"></a></td>
            <td><form th:action="@{/students/removeFromBasket}" method="POST" style="display: inline;">
                <input type="hidden" name="yopCode" th:value="${program.department.yop_code}">
                <button type="submit" class="btn btn-delete">SİL</button>
            </form>
            </td>

        </tr>
        </tbody>
    </table>

    <button class="btn btn-primary mt-3" onclick="saveOrder()">💾 Sıralamayı Kaydet</button>
</div>

<script>
    // Sürükle-bırak başlat
    const sortable = new Sortable(document.getElementById('sortable-table'), {
        animation: 150,
        onEnd: function () {
            const rows = document.querySelectorAll("#sortable-table tr");
            rows.forEach((row, index) => {
                row.querySelector("td:first-child").innerText = index + 1;
            });
        }
    });

    // Sayfa yüklendiğinde sıralamayı etkinleştir
    document.addEventListener('DOMContentLoaded', function() {
        const sortable = new Sortable(document.getElementById('sortable-table'), {
            animation: 150,
            handle: '.sortable-row',
            onEnd: function() {
                updateRowNumbers();
            }
        });
    });

    // Satır numaralarını güncelle
    function updateRowNumbers() {
        const rows = document.querySelectorAll("#sortable-table tr");
        rows.forEach((row, index) => {
            row.querySelector("td:first-child").textContent = index + 1;
        });
    }

    function saveOrder() {
        const order = [];
        const rows = document.querySelectorAll("#sortable-table tr");

        rows.forEach((row, index) => {
            const yopKodu = parseInt(row.querySelector("td:nth-child(2)").textContent);
            order.push({
                yopKodu: yopKodu,
                sira: index + 1  // Sıra numarasını 1'den başlat
            });
        });

        fetch('/students/savePreferencesBasket', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(order)
        })
            .then(response => response.text())
            .then(message => {
                alert(message);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Sıralama kaydedilirken hata oluştu: ' + error.message);
            });

    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
