    <!DOCTYPE html>
    <html lang="tr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Register Page</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />

        <!-- Font Awesome (göz ikonları için) -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

        <style>
            body, html {
                height: 100%;
            }
            .centered-container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100%;
            }
            .custom-border {
                border: 2px solid #0dcaf0; /* Bootstrap bg-info rengi */
            }
        </style>
    </head>

    <body>
    <div class="container centered-container">
        <div class="card custom-border" style="width: 100%; max-width: 450px;">
            <div class="card-header bg-info text-white text-center">
                Hesap Oluştur
            </div>

            <div class="card-body">
                <form action="#" th:action="@{/students/save}"  method="post" class="form-horizontal">



                    <!-- E-posta -->
                    <div class="mb-3">
                        <input type="email"  name="email" placeholder="E-posta" class="form-control"  />
                    </div>

                    <!-- Şifre (göster/gizle ikonlu) -->
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="password"  id="password" name="password" placeholder="Şifre" class="form-control"  />
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="fa-solid fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Hesap Oluştur Butonu -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Hesap Oluştur</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Şifre göster/gizle scripti -->
    <script>
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", function () {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);

            if (type === "password") {
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            } else {
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            }
        });
    </script>
    </body>
    </html>
