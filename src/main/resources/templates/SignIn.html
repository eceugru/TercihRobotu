<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login Page</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* Sayfa ortalama */
        body, html {
            height: 100%;
        }
        .centered-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
    </style>
</head>

<body>
<div class="container centered-container">
    <div class="card border-info" style="width: 100%; max-width: 400px;">
        <div class="card-header bg-info text-white text-center">
            Giriş Yap
        </div>

        <div class="card-body">
            <div class="card-text">
                <!-- Login Form -->
                <form action="#" th:action="@{/students/giris}"  method="post" class="form-horizontal">

                    <!-- Error/Logout messages -->
                    <div th:if="${param.error}">
                        <div class="alert alert-danger">Invalid username and password.</div>
                    </div>

                    <div th:if="${param.logout}">
                        <div class="alert alert-success">You have been logged out.</div>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <input type="text" name="email" placeholder="e-posta" class="form-control" />
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <input type="password" name="password" placeholder="şifre" class="form-control" />
                    </div>

                    <!-- Buttons side by side <a  class="btn btn-success">Giriş</a>  -->
                    <div class="d-flex justify-content-between">
                        <button class="btn btn-success" >Giriş</button>
                        <a th:href="@{/students/showFormStudentForAdd}"  class="btn btn-primary">Hesap Oluştur</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
